name: original_bible
description: "Original Bible App - Hebrew/Greek Bible with translations"
publish_to: 'none'
version: 1.0.3+24

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # Navigation
  go_router: ^14.6.3
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Storage
  shared_preferences: ^2.3.4
  
  # Utils
  collection: ^1.19.0
  flutter_hooks: ^0.20.5
  share_plus: ^10.0.0

  # Audio (original-language recitation via platform TTS)
  flutter_tts: ^4.2.0

  # Networking (opt-in AI passage explanation only; everything else is offline)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.0

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/
    - assets/fonts/
  
  fonts:
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/EzraSIL.ttf
    - family: Gentium
      fonts:
        - asset: assets/fonts/Gentium-Regular.ttf
