name: original_bible
description: "Original Bible App - Hebrew/Greek Bible with translations"
publish_to: 'none'
version: 1.0.6+29

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  
  # Navigation
  go_router: ^14.6.3
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Storage
  shared_preferences: ^2.3.4
  in_app_review: ^2.0.9
  
  share_plus: ^10.0.0

  # Audio (original-language recitation). Platform TTS is the fallback; the
  # bundled offline engine (sherpa-onnx + a redistributable Piper voice) is the
  # primary path where a voice is available. See lib/features/audio/.
  flutter_tts: ^4.2.0
  sherpa_onnx: ^1.13.8
  audioplayers: ^6.1.0

  # Networking (opt-in AI passage explanation only; everything else is offline)
  http: ^1.2.2
  flutter_local_notifications: 22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.0

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "branding/app_icon.png"
  image_path: "branding/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "branding/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "branding/app_icon.png"
  windows:
    generate: true
    image_path: "branding/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/
    - assets/fonts/
    # Listed by name so a build without the generated database fails loudly
    # instead of shipping an app with no Bible text (iOS build 27 did).
    - assets/bible.db
    # Bundled Greek recitation voice. Prepare it with
    # `python3 scripts/fetch_embedded_voices.py`; the archive cache and the
    # manifest are intentionally not bundled.
    - assets/voices/el_GR-rapunzelina-low/
    # Flutter does not recursively include subdirectories. The phonemizer
    # needs these alongside the model, including the Greek language rules.
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/aav/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/art/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/azc/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/bat/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/bnt/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/ccs/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/cel/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/cus/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/dra/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/esx/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/gmq/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/gmw/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/grk/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/inc/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/ine/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/ira/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/iro/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/itc/
