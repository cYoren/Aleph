name: original_bible
description: "Original Bible App - Hebrew/Greek Bible with translations"
publish_to: 'none'
version: 1.0.6+29

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  
  # Navigation
  go_router: ^14.6.3
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Storage
  shared_preferences: ^2.3.4
  in_app_review: ^2.0.9
  
  share_plus: ^10.0.0

  # Audio (original-language recitation via platform TTS)
  flutter_tts: ^4.2.0

  # Networking (opt-in AI passage explanation only; everything else is offline)
  http: ^1.2.2
  flutter_local_notifications: 22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.0

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "branding/app_icon.png"
  image_path: "branding/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "branding/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "branding/app_icon.png"
  windows:
    generate: true
    image_path: "branding/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    # Named individually instead of `- assets/`, so the raw generated
    # `assets/bible.db` the build leaves on disk is never packaged. Only the
    # packed asset further down ships; without this, iOS and macOS would carry
    # both.
    - assets/alphabet_hints.json
    - assets/alphabet.json
    - assets/book_names.json
    - assets/names.json
    - assets/fonts/
    # Listed by name so a build without the generated database fails loudly
    # instead of shipping an app with no Bible text (iOS build 27 did). The
    # database ships gzip-compressed and is unpacked on first launch; generate
    # it with `python3 scripts/prepare_bible_db.py`.
    - assets/bible.db.gz
  
  fonts:
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/EzraSIL.ttf
    - family: Gentium
      fonts:
        - asset: assets/fonts/Gentium-Regular.ttf
