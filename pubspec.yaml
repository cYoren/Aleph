    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/map/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/miz/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/myn/
    - assets/voices/el_GR-rapunzelina-low/espeak-ng-data/lang/poz/
