name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_PATH: .
      BUNDLE_ID: com.originalbible.originalBible
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install distribution cert
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          CERT_FILE="$RUNNER_TEMP/apple_dist.p12"
          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare ASC keys
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          python3 -c "
          import os,json
          k=os.environ['ASC_API_KEY_P8'].replace('\\\\n','\\n')
          p=os.environ['RUNNER_TEMP']
          open(f'{p}/asc/AuthKey_' + os.environ['ASC_API_KEY_ID'] + '.p8','w').write(k)
          json.dump({'key_id':os.environ['ASC_API_KEY_ID'],'issuer_id':os.environ['ASC_ISSUER_ID'],'key':k,'duration':1200,'in_house':False},open(f'{p}/asc/api_key.json','w'))
          "

      - name: Inject Development Team (only)
        working-directory: ${{ env.APP_PATH }}
        run: |
          python3 -c "import os, re; p=open('ios/Runner.xcodeproj/project.pbxproj').read(); p=re.sub(r'(PRODUCT_BUNDLE_IDENTIFIER[^;]+;)', lambda m: m.group(1) + chr(10) + chr(9)*4 + 'DEVELOPMENT_TEAM = ' + os.environ['APPLE_TEAM_ID'] + ';', p); open('ios/Runner.xcodeproj/project.pbxproj','w').write(p)"

      - name: Install dependencies
        working-directory: ${{ env.APP_PATH }}
        run: |
          flutter pub get
          if [ -f scripts/build_full_bible_db.py ]; then
            mkdir -p build
            python3 scripts/build_full_bible_db.py --output assets/bible.db --cache-dir /tmp/original_bible_db_cache --strict-coverage --fill-kjv-gaps --emit-coverage-report build/coverage_report.json
          fi

      - name: Create dist profile and build IPA
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          set -euo pipefail
          # Create distribution provisioning profile
          fastlane run sigh \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            team_id:"$APPLE_TEAM_ID" \
            skip_install:false \
            force:true
          # Build (no sign), then archive with -allowProvisioningUpdates + auth key
          flutter build ios --release --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ios/archive/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            archive
          # Export IPA with the distribution profile
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa_export"

      - name: Upload to TestFlight
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          IPA=$(find build/ios/ipa -name '*.ipa' 2>/dev/null | head -1)
          test -n "$IPA"
          fastlane run pilot upload \
            ipa:"$IPA" \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            skip_waiting_for_build_processing:true

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
