name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_PATH: .
      BUNDLE_ID: com.originalbible.originalBible
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install distribution cert
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          CERT_FILE="$RUNNER_TEMP/apple_dist.p12"
          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare ASC keys
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          python3 -c "
          import os,json
          k=os.environ['ASC_API_KEY_P8'].replace('\\\\n','\\n')
          p=os.environ['RUNNER_TEMP']
          open(f'{p}/asc/AuthKey_' + os.environ['ASC_API_KEY_ID'] + '.p8','w').write(k)
          json.dump({'key_id':os.environ['ASC_API_KEY_ID'],'issuer_id':os.environ['ASC_ISSUER_ID'],'key':k,'duration':1200,'in_house':False},open(f'{p}/asc/api_key.json','w'))
          "

      - name: Create profile and inject signing
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          set -euo pipefail
          # Step 1: Create distribution provisioning profile with sigh
          fastlane run sigh \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            team_id:"$APPLE_TEAM_ID" \
            skip_install:false \
            force:true
          # Step 2: Inject DEVELOPMENT_TEAM, CODE_SIGN_STYLE=Manual, PROVISIONING_PROFILE_SPECIFIER
          python3 -c "
          import os, re
          team = os.environ['APPLE_TEAM_ID']
          prof = os.environ['BUNDLE_ID'] + ' AppStore'
          with open('ios/Runner.xcodeproj/project.pbxproj') as f:
              c = f.read()
          c = re.sub(r'(PRODUCT_BUNDLE_IDENTIFIER[^;]+;)', lambda m: m.group(1) + chr(10) + chr(9)*4 + 'DEVELOPMENT_TEAM = ' + team + ';' + chr(10) + chr(9)*4 + 'CODE_SIGN_STYLE = Manual;' + chr(10) + chr(9)*4 + 'CODE_SIGN_IDENTITY = \\\"Apple Distribution\\\";' + chr(10) + chr(9)*4 + 'PROVISIONING_PROFILE_SPECIFIER = \\\"' + prof + '\\\";', c)
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(c)
          print('injected: team=' + team + ' profile=' + prof)
          "

      - name: Install dependencies
        working-directory: ${{ env.APP_PATH }}
        run: |
          flutter pub get
          if [ -f scripts/build_full_bible_db.py ]; then
            mkdir -p build
            python3 scripts/build_full_bible_db.py --output assets/bible.db --cache-dir /tmp/original_bible_db_cache --strict-coverage --fill-kjv-gaps --emit-coverage-report build/coverage_report.json
          fi

      - name: Build IPA
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$BUNDLE_ID AppStore" \
            CODE_SIGN_STYLE=Manual \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${BUNDLE_ID} AppStore</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa_export"

      - name: Upload to TestFlight
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          IPA=$(find "$RUNNER_TEMP/ipa_export" -name '*.ipa' 2>/dev/null | head -1)
          test -n "$IPA"
          fastlane run pilot upload \
            ipa:"$IPA" \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            skip_waiting_for_build_processing:true

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa_export/*.ipa
          if-no-files-found: ignore
