name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    name: Build and upload
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .
    env:
      APP_PATH: .
      BUNDLE_ID: com.originalbible.originalBible
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # O Xcode padrao do runner e antigo demais para device_info_plus 13.2.0,
      # que usa NSProcessInfo.isiOSAppOnVision. Selecionar o mais novo instalado.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "usando $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Verify Apple build toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Nao fixar DEVELOPER_DIR: o passo anterior ja selecionou o Xcode mais
          # novo do runner. Fixar /Applications/Xcode.app aponta para o 16.4 da
          # imagem e derruba o build. Versoes exatas tambem nao servem aqui,
          # porque eram as da maquina do Gustavo; exigir minimos.
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          FLUTTER_VERSION="$(flutter --version | awk 'NR==1 {print $2}')"
          printf 'Xcode=%s iPhoneOSSDK=%s Flutter=%s\n' "$XCODE_VERSION" "$SDK_VERSION" "$FLUTTER_VERSION"
          major() { printf '%s' "${1%%.*}"; }
          test "$(major "$XCODE_VERSION")" -ge 26
          test "$(major "$SDK_VERSION")" -ge 26

      - name: Install distribution cert
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          CERT_FILE="$RUNNER_TEMP/apple_dist.p12"
          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare ASC keys
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          python3 -c "
          import os,json
          k=os.environ['ASC_API_KEY_P8'].replace('\\\\n','\\n')
          p=os.environ['RUNNER_TEMP']
          open(f'{p}/asc/AuthKey_' + os.environ['ASC_API_KEY_ID'] + '.p8','w').write(k)
          json.dump({'key_id':os.environ['ASC_API_KEY_ID'],'issuer_id':os.environ['ASC_ISSUER_ID'],'key':k,'duration':1200,'in_house':False},open(f'{p}/asc/api_key.json','w'))
          "

      - name: Create dist profile + set up signing + build
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          set -euo pipefail
          # 1) Create distribution provisioning profile
          fastlane run sigh \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            team_id:"$APPLE_TEAM_ID" \
            skip_install:false \
            force:true

          # 2) Inject all signing settings ONLY where PRODUCT_BUNDLE_IDENTIFIER matches our bundle
          python3 -c "
          import os, re
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['BUNDLE_ID']
          prof = bundle + ' AppStore'
          with open('ios/Runner.xcodeproj/project.pbxproj') as f:
              c = f.read()
          # Only inject into build configs that have our specific bundle ID (Runner target only)
          c = re.sub(
              r'(PRODUCT_BUNDLE_IDENTIFIER = ' + re.escape(bundle) + ';)',
              lambda m: m.group(1) + chr(10) + chr(9)*4 + 'DEVELOPMENT_TEAM = ' + team + ';'
                        + chr(10) + chr(9)*4 + 'CODE_SIGN_STYLE = Manual;'
                        + chr(10) + chr(9)*4 + 'CODE_SIGN_IDENTITY = \\\"Apple Distribution\\\";'
                        + chr(10) + chr(9)*4 + 'PROVISIONING_PROFILE_SPECIFIER = \\\"' + prof + '\\\";',
              c
          )
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(c)
          print('injected runner-only: team=' + team + ' profile=' + prof)
          "

          # 3) Install deps
          flutter pub get
          if [ -f scripts/build_full_bible_db.py ]; then
            mkdir -p build
            for attempt in 1 2 3 4 5; do
              python3 scripts/build_full_bible_db.py --output assets/bible.db --cache-dir /tmp/original_bible_db_cache --strict-coverage --fill-kjv-gaps --emit-coverage-report build/coverage_report.json && break
              echo "Bible DB build failed (attempt $attempt), retrying in 10s..."
              sleep 10
            done
          fi

          # 4) Build unsigned, then archive (no -allowProvisioningUpdates - just use our settings)
          flutter build ios --release --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive
          ARCHIVE_APP=$(find build/ios/archive/Runner.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$ARCHIVE_APP"
          for PLIST in "$ARCHIVE_APP/Info.plist" "$ARCHIVE_APP"/PlugIns/*.appex/Info.plist; do
            [ -f "$PLIST" ] || continue
            /usr/libexec/PlistBuddy -c "Set :BuildMachineOSBuild 25G83" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :BuildMachineOSBuild string 25G83" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print :BuildMachineOSBuild" "$ARCHIVE_APP/Info.plist"

      - name: Export and upload
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          set -euo pipefail
          # Export IPA with the distribution profile
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${BUNDLE_ID} AppStore</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa_export"

          # Upload to TestFlight
          IPA=$(find "$RUNNER_TEMP/ipa_export" -name '*.ipa' 2>/dev/null | head -1)
          test -n "$IPA"
          fastlane run pilot upload \
            ipa:"$IPA" \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            skip_waiting_for_build_processing:true

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa_export/*.ipa
          if-no-files-found: ignore
