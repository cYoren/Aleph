name: Android production release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    name: Build and upload Android production
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate providers
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release database
        run: |
          set -euo pipefail
          mkdir -p build
          python3 scripts/build_full_bible_db.py \
            --output assets/bible.db \
            --cache-dir /tmp/original_bible_db_cache \
            --strict-coverage \
            --fill-kjv-gaps \
            --emit-coverage-report build/coverage_report.json
      - name: Validate release
        run: bash ./scripts/validate_release.sh
      - name: Build signed Android App Bundle
        run: flutter build appbundle --release
      - name: Upload production bundle
        run: |
          set -euo pipefail
          fastlane supply \
            --package_name com.originalbible.original_bible \
            --track production \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --json_key "$HOME/Documents/Coding/.fastlane/google-play-key.json" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
