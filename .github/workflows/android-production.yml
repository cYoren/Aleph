name: Android production release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    name: Build and upload Android production
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build release database
        run: |
          set -euo pipefail
          mkdir -p build
          python3 scripts/build_full_bible_db.py \
            --output assets/bible.db \
            --cache-dir /tmp/original_bible_db_cache \
            --strict-coverage \
            --fill-kjv-gaps \
            --emit-coverage-report build/coverage_report.json
      - name: Prepare bundled offline voices
        run: python3 scripts/fetch_embedded_voices.py
      - name: Validate release
        run: bash ./scripts/validate_release.sh
      - name: Install Android signing assets
        run: |
          set -euo pipefail
          cp "$HOME/Documents/Coding/Original bible/android/key.properties" android/key.properties
          cp "$HOME/Documents/Coding/Original bible/android/app/release-keystore.jks" android/app/release-keystore.jks
      - name: Build signed Android App Bundle
        env:
          ALEPH_AI_PROXY: ${{ vars.ALEPH_AI_PROXY }}
        run: flutter build appbundle --release --dart-define=ALEPH_AI_PROXY="${ALEPH_AI_PROXY:-}"
      - name: Upload production bundle
        run: |
          set -euo pipefail
          fastlane supply \
            --package_name com.originalbible.original_bible \
            --track production \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --json_key "$HOME/Documents/Coding/.fastlane/google-play-key.json" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
