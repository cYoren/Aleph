name: Capture native App Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .
    env:
      BUNDLE_ID: com.originalbible.originalBible
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Bible data if needed
        run: |
          set -euo pipefail
          if [ -f scripts/build_full_bible_db.py ] && [ ! -f assets/bible.db ]; then
            mkdir -p build
            python3 scripts/build_full_bible_db.py --output assets/bible.db --cache-dir /tmp/original_bible_db_cache --strict-coverage --fill-kjv-gaps --emit-coverage-report build/coverage_report.json
          fi
      - name: Prepare bundled database asset
        run: python3 scripts/prepare_bible_db.py
      - name: Build simulator app
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --debug --no-codesign
      - name: Capture native simulator screens
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/ios/iphonesimulator/Runner.app"
          test -d "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/store-screenshots"
          DEVICES_JSON="$(xcrun simctl list devices available -j)"
          read_device() {
            python3 - "$1" "$DEVICES_JSON" <<'PY'
          import json
          import sys
          wanted = sys.argv[1]
          payload = json.loads(sys.argv[2])
          ids = [d["udid"] for group in payload.get("devices", {}).values() for d in group if d.get("isAvailable") and d.get("name") == wanted]
          if not ids:
              raise SystemExit(f"No available simulator named: {wanted}")
          print(ids[-1])
          PY
          }
          capture() {
            local name="$1"; local udid="$2"; local output="$GITHUB_WORKSPACE/store-screenshots/$3"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"
            xcrun simctl launch "$udid" "$BUNDLE_ID"
            sleep 12
            xcrun simctl io "$udid" screenshot "$output"
            xcrun simctl shutdown "$udid" || true
            echo "Captured $name: $output"
          }
          capture "iPhone 15 Pro Max" "$(read_device 'iPhone 15 Pro Max')" "iphone-67.png"
          capture "iPhone 11 Pro Max" "$(read_device 'iPhone 11 Pro Max')" "iphone-65.png"
          capture "iPad Pro (12.9-inch) (6th generation)" "$(read_device 'iPad Pro (12.9-inch) (6th generation)')" "ipad-129.png"
          file "$GITHUB_WORKSPACE/store-screenshots"/*.png
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-bible-native-screenshots
          path: store-screenshots/*.png
          if-no-files-found: error
